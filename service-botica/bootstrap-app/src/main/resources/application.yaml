spring:
  application:
    name: service-botica
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_botica}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:migrations,classpath:db/migration
  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      verification-enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true

security:
  local-auth:
    jwt-secret: ${BOTICA_JWT_SECRET:}
    issuer: ${BOTICA_JWT_ISSUER:service-botica}
    audience: ${BOTICA_JWT_AUDIENCE:service-botica-api}
    access-token-ttl: ${BOTICA_ACCESS_TOKEN_TTL:PT10M}
    refresh-token-ttl: ${BOTICA_REFRESH_TOKEN_TTL:P7D}
    password-reset-ttl: ${BOTICA_PASSWORD_RESET_TTL:PT30M}
    max-failed-attempts: ${BOTICA_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${BOTICA_LOCK_DURATION:PT15M}
